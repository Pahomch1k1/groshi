name: Groshi
options:
  bundleIdPrefix: app.groshi
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ru
packages:
  GroshiCore:
    path: Core
targets:
  Groshi:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: GroshiCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "WorkFlow Spend"
        CFBundleShortVersionString: "0.3.1"
        CFBundleVersion: "4"
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDevelopmentRegion: ru
        CFBundleLocalizations: [ru, uk, en]
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "Микрофон нужен, чтобы диктовать операции ассистенту."
        NSSpeechRecognitionUsageDescription: "Распознавание речи превращает вашу голосовую команду в текст."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.groshi.ios
        PRODUCT_NAME: Groshi
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
  GroshiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Groshi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.groshi.ios.uitests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Groshi
schemes:
  Groshi:
    build:
      targets:
        Groshi: all
        GroshiUITests: [test]
    test:
      config: Debug
      targets:
        - GroshiUITests
    archive:
      config: Release
