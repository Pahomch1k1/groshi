name: Core tests (Linux)

on:
  push:
    paths: ["Core/**", ".github/workflows/core-tests.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    container: swift:6.0-jammy
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and test GroshiCore
        working-directory: Core
        env:
          # Tools + system prompt for synthetic data; used by the local live-OpenAI harness.
          AI_CONTRACT_OUT: ${{ github.workspace }}/ai-contract.json
        run: swift test 2>&1 | tail -n 150
        shell: bash -o pipefail {0}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-contract
          path: ai-contract.json
          if-no-files-found: ignore
