name: Core tests (Linux)

on:
  push:
    paths: ["Core/**", ".github/workflows/core-tests.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    container: swift:6.0-jammy
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and test GroshiCore
        working-directory: Core
        run: swift test 2>&1 | tail -n 120
        shell: bash -o pipefail {0}
